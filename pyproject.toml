[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-pydantic-agent"
dynamic = ["version"]
description = "Settings-agnostic Django agent-host substrate for Pydantic-AI: config in, built agent out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "pydantic-ai", "agent", "llm", "ai", "toolset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # Slim core only. Unlike a transport package this pulls **no** wire extra —
    # the AG-UI adapter (and its ag-ui-protocol floor) belongs to django-ag-ui,
    # A2A's belongs to django-a2a. The substrate just builds the agent.
    #
    # The floor is 2.16 because ``ToolFailurePolicy`` imports
    # ``pydantic_ai.exceptions.ToolFailed`` at module scope, and that symbol
    # first exists in 2.16.0. A wider floor is not "more compatible" here: the
    # capability is composed by default, so importing this package at all fails
    # on 2.15 and below. Raise it whenever a new default reaches for a newer
    # upstream symbol.
    "pydantic-ai-slim>=2.16,<3",
]

[project.optional-dependencies]
# Model-provider extras (slim ships none). Install one to use a "provider:model"
# string, e.g. `pip install django-pydantic-agent[anthropic]`.
# Anthropic's own floor is higher than the others and stays that way. The
# ``anthropic`` SDK 1.0.0 (PyPI, 2026-08-20) is rebuilt on ``httpx2`` and drops
# legacy ``httpx``, and every pydantic-ai before 2.33 hands ``AnthropicProvider``
# an ``httpx.AsyncClient`` the 1.x SDK rejects at runtime. Those releases permit
# the pairing without supporting it, so a fresh install of a 2.16 floor resolves
# a broken set. Raised rather than capping ``anthropic``, which would pin
# consumers to an SDK major that upstream has already moved past.
anthropic = ["pydantic-ai-slim[anthropic]>=2.33,<3"]
openai = ["pydantic-ai-slim[openai]>=2.16,<3"]
google = ["pydantic-ai-slim[google]>=2.16,<3"]
# In-process bridge exposing a drf-mcp-server tool registry as a Pydantic-AI
# toolset (the agent calls DRF tools without a network hop).
# Floored at 0.49, where a read-shaping ``QueryParam`` value the output
# serializer refuses while rendering is an ``isError`` ``validation_error``
# result naming the argument, which this bridge raises as ``ModelRetry``. Below
# it the refusal escaped ``call_tool`` as a raw ``ValidationError`` and ended the
# run over a selection the model could have corrected, most often one written
# against a paged tool's envelope. It moves in lockstep with the
# ``[spec-tools]`` floor below, which fixed the same render on that route: a
# mismatched pair makes one spec self-correcting on one route and fatal on the
# other.
#
# 0.48 was the previous floor, the release that answers in process which tools a listing
# leaves out and why. The bridge offers the tools a fresh listing would on every
# step, which needs both halves of that release: ``aunavailable_tools`` for the
# answer, and ``list_tools(include_unavailable=True)`` so a tool unavailable
# when the bridge lists still has a definition to offer once it becomes
# available. Below it neither exists -- ``list_tools`` raises ``TypeError`` for
# the argument and the server has no such method -- so this is a hard floor
# rather than a behavioural one. Subsumed.
#
# 0.46 was the floor before that, where a ``ServiceSpec`` declaring ``many=True`` registers as a
# tool and takes its list under one named argument. Below it the registry refuses
# such a spec outright, so the bridge lists no tool for it at all while the
# ``[spec-tools]`` route offers one -- which is why this floor and that one move
# together rather than each on its own schedule. 0.46 also stops a ``many=True``
# chain step collapsing its list to one row through an output re-fetch, and
# refuses a chain that inherits such a step's ``input_serializer`` rather than
# handing the bulk service a single item as ``data``. It floors drf-services at
# 0.53.0 in turn, and hard: every service dispatch passes ``many_as_argument``,
# which first exists there, so below it every service tool call raises
# ``TypeError`` at the call rather than at import.
#
# 0.45 was the previous floor, the release that serves a refusal's ``code`` in a
# tool's error result, which this bridge carries into the ``ToolFailed`` text.
# Below it the
# suffix is never written, and the model reads a refusal worded differently from
# the one the ``[spec-tools]`` route gives for the same rule. 0.45 also resolves a
# chain's RETRIEVE step to its row before the object-level permission judges it:
# below it a selector returning a queryset skipped that check, and a chain tool
# rendered without an output serializer answered with the text of the row the
# rule refuses. It floored drf-services at 0.52.1 in turn. Subsumed. Nothing here
# declares drf-services directly, so the extra is where the constraint can be
# stated.
#
# 0.44 was the previous floor, where the tools this bridge lists and calls caught
# up with drf-services' affordances: below it a chain tool ran a step whose
# service's own affordances refuse it, and the ``outputSchema`` handed to the
# model as ``return_schema`` left out the ``affordances`` object. Subsumed.
#
# 0.37 was the floor before that, the first release carrying drf-services>=0.49
# after a serializer that nests itself crashed the catalog walk. That constraint
# still holds and is subsumed.
drf-mcp = ["djangorestframework-mcp-server>=0.49"]
# Expose drf-services specs directly as agent tools via djangorestframework-
# pydantic-ai's SpecCapability — no MCP server in the path.
# Floored at 0.32, where a read-shaping value the output serializer refuses
# while rendering is a ``ModelRetry`` naming the argument rather than a raw
# ``ValidationError`` ending the run, and an explicit ``null`` for one is
# omitted rather than reaching the serializer as the string ``None``. It moves in
# lockstep with the ``[drf-mcp]`` floor above for the reason that pairing always
# has: both routes now let a model correct a selection it got wrong.
#
# 0.31 was the previous floor, which names each operation an unmet condition left out, with
# its reason, in that step's instructions. It moves in lockstep with the
# ``[drf-mcp]`` floor above for the reason that pairing always has: both routes
# now tell a model why an operation is missing, in one sentence, and this
# package's tests assert the bridge's wording against this package's real
# output. Below 0.31 there is no such wording to agree with, and a model would
# be told why on one route and left guessing on the other. Subsumed.
#
# 0.30 was the floor before that, where a ``ServiceSpec`` declaring ``many=True`` is a tool
# taking its list as one named argument, and a ``QueryParam`` or ``UrlKwarg``
# named after that argument is refused when the toolset is built rather than
# making every call come back asking for the argument the model just sent. It
# moves in lockstep with the ``[drf-mcp]`` floor above: 0.29 refuses such a spec
# where drf-mcp 0.46 offers it, so a mismatched pair makes one spec a working
# tool on one route and an ``ImproperlyConfigured`` on the other, which is the
# disagreement both comments exist to prevent. It floors drf-services at 0.53.0
# in turn, and hard: every spec call passes ``many_as_argument``, so below it
# every tool call raises ``TypeError`` once a model calls one.
#
# 0.29 was the previous floor, where a call an ``Affordance`` refuses fails with
# the rule's
# code after its reason, the wording the ``[drf-mcp]`` bridge writes for the same
# refusal; below it the code is dropped. 0.29 also returns ``None`` where a tool
# finds nothing, rather than a row of empty fields, and refuses a ``many=True``
# service spec when the toolset is built, so ``build_spec_capability`` raises
# ``ImproperlyConfigured`` for one instead of offering a tool no call can
# satisfy. It floored drf-services at 0.52.1 in turn. Subsumed.
#
# 0.28 was the previous floor, where a spec tool's ``return_schema`` declares the
# ``affordances`` object drf-services renders into each item. Subsumed.
#
# 0.24 was the floor before that, for the recursion crash above one level down:
# build_spec_capability constructs a SpecCapability, whose tool definitions are
# schemas, so the crash landed at construction rather than at a call. Subsumed.
spec-tools = ["djangorestframework-pydantic-ai>=0.32"]
# pydantic-ai-harness capabilities (lazy-imported; the core install stays slim):
# CodeMode batching, compaction, step persistence, sub-agents.
harness = ["pydantic-ai-harness[code-mode]>=0.13"]

[project.urls]
Homepage = "https://github.com/Artui/django-pydantic-agent"
Repository = "https://github.com/Artui/django-pydantic-agent"
Issues = "https://github.com/Artui/django-pydantic-agent/issues"

[tool.hatch.version]
path = "django_pydantic_agent/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_pydantic_agent"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    # The [drf-mcp] extra's backing package, so its bridge + tests run in dev.
    # Must move in lockstep with the extra — a dev group pinning the old band
    # makes the project unsatisfiable against its own extra.
    "djangorestframework-mcp-server>=0.49",
    # The [spec-tools] extra's backing package, so its capability + tests run in dev.
    "djangorestframework-pydantic-ai>=0.32",
    # The [harness] extra's backing package, so the harness capabilities run in dev.
    "pydantic-ai-harness[code-mode]>=0.13",
    # Provider libs so the api_key / provider model-building path is exercised
    # in dev/CI (the extras above ship to consumers, not the dev env).
    # Floored with the ``anthropic`` extra above, for the reason given there --
    # the floor job resolves this group too, and at 2.16 it resolves a pairing
    # that fails at runtime.
    "pydantic-ai-slim[anthropic,openai,google]>=2.33",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=django_pydantic_agent --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
# drf-mcp 0.20+ warns when a tool is registered with no description. Two bridge
# fixtures register one deliberately, to cover the no-description path, so the
# warning is expected rather than a signal. Matched on the message: naming the
# category by dotted path makes pytest import drf-mcp at config time, before
# DJANGO_SETTINGS_MODULE is applied.
filterwarnings = [
    "ignore:MCP tool .* is registered with no description",
]

[tool.coverage.run]
branch = true
source = ["django_pydantic_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
# This package ships contrib/store/migrations/, so the second entry is load-bearing.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_pydantic_agent"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_pydantic_agent"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# django_pydantic_agent/version.py and promotes the CHANGELOG [Unreleased] block
# under a new dated heading.
[tool.bumpversion]
current_version = "0.26.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_pydantic_agent/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-pydantic-agent/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-pydantic-agent/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-pydantic-agent/compare/v{current_version}...v{new_version}"""
